              style: 'display:inline-flex;align-items:center;gap:6px;padding:0 8px;min-height:28px;box-sizing:border-box;font-family:FKGrotesk,sans-serif;font-size:13px;line-height:16px;font-weight:600;cursor:pointer;' + (on ? 'color:#fff;background:#000;border:1px solid #000;' : 'color:#000;background:#fff;border:1px solid #ddd;'),
              pick: () => this.setState({ gen: on ? 'vse' : k }) }; }),
          genders: G.map(([k, l], i) => { const on = gen === k; const x = on && k !== 'vse';
            return { label: l, x, pressed: on ? 'true' : 'false', aria: x ? l + ' – zrušit výběr' : l,
            style: gbase + (on ? 'color:#fff;background:#000;border:1px solid #000;' : 'color:#000;background:#fff;border:1px solid #ddd;'),
            pick: () => this.setState({ gen: x ? 'vse' : k }) }; }),
          navItems: N.map(([k, l, sub]) => {
            const open = mg === k; const isCur = cur === k; const sale = k === 'slevy';
            const on = open || (isCur && !mg);
            return { label: l, sale: sale ? 'true' : 'false', hasMenu: !!sub, isLink: !sub, expanded: open ? 'true' : 'false',
              style: base + 'color:' + (sale ? '#F59700' : (on ? '#00A151' : '#000')) + ';' + 'border-bottom:3px solid ' + (on ? (sale ? '#F59700' : '#00A151') : 'transparent') + ';',
              chev: 'transform:rotate(' + (open ? '180deg' : '0deg') + ')',
              toggle: () => this.setState({ mega: open ? null : k, sopen: false }),
              open: () => this.setState({ mega: sub ? k : null, sopen: false }) };
          })
        };
      })(),
      footCols: [
        { title: 'Pro zákazníky', links: ['Jak nakupovat', 'Doprava a platba', 'Rezervace zboží', 'Vrácení a výměna', 'Reklamace', 'Velikostní tabulky', 'Dárkové poukazy'] },
        { title: 'Smluvní podmínky', links: ['Obchodní podmínky', 'Odstoupení od smlouvy', 'Ochrana osobních údajů', 'Cookies', 'Pravidla akce kachna'] },
        { title: 'O nás', links: ['Proč Cartoon', 'Prodejna Panská 7', 'Carhartt WIP Praha', 'Distribuce Carhartt WIP CZ/SK', 'Značky', 'Práce', 'Spolupráce'] }
      ].map((c, i) => ({ title: c.title, links: c.links, open: this.state.foot === i, expanded: this.state.foot === i ? 'true' : 'false', sign: this.state.foot === i ? '−' : '+', toggle: () => this.setState({ foot: this.state.foot === i ? -1 : i }) })),
      accent: this.props.accent ?? '#00A151',
      ...(() => {
        const ALL = [
        ['Prodejna', '[datum]', 'Nová kolekce Carhartt WIP jaro / léto 2026 je v Panské 7', 'Jaro / léto 2026 je na věšácích. Přijď si ji vyzkoušet.'],
        ['Mailing', '[datum]', 'Archive drop: co přesně dorazilo', 'Kompletní přehled archivních kousků Carhartt WIP, které jsou teď skladem.'],
        ['Akce', '[datum]', 'Akce kachna pokračuje', '[Krátký perex – jak akce kachna funguje a do kdy platí.]'],
        ['Kolekce', '[datum]', '[Název novinky – nová kolekce]', '[Krátký perex novinky.]'],
        ['Prodejna', '[datum]', '[Název novinky – prodejna]', '[Krátký perex novinky.]'],
        ['Mailing', '[datum]', '[Název mailingu]', '[Krátký perex mailingu.]'],
        ['Akce', '[datum]', '[Název akce]', '[Krátký perex akce.]'],
        ['Kolekce', '[datum]', '[Název novinky – kolekce]', '[Krátký perex novinky.]'],
        ['Mailing', '[datum]', '[Název mailingu]', '[Krátký perex mailingu.]'],
        ['Prodejna', '[datum]', '[Název novinky – prodejna]', '[Krátký perex novinky.]']
      ];
        const TAGS = ['Vše', 'Prodejna', 'Kolekce', 'Akce', 'Mailing'];
        const cur = this.state.tag || 'Vše';
        const list = ALL.filter(x => cur === 'Vše' || x[0] === cur).map(x => ({ tag: x[0], date: x[1], title: x[2], text: x[3] }));
        return {
          tags: TAGS.map(tg => ({ label: tg, count: tg === 'Vše' ? ALL.length : ALL.filter(x => x[0] === tg).length, pressed: cur === tg ? 'true' : 'false', pick: () => this.setState({ tag: tg }),
            style: 'min-height:44px;padding:0 16px;flex:0 0 auto;white-space:nowrap;font-family:FKGrotesk,sans-serif;font-size:15px;font-weight:600;cursor:pointer;' + (cur === tg ? 'background:#000;color:#fff;border:1px solid #000' : 'background:#fff;color:#000;border:1px solid #ddd') })),
          featured: list[0] || { tag: '', date: '', title: 'Žádné novinky', text: '' }, hasFeatured: list.length > 0,
          rest: list.slice(1), countLabel: list.length + (list.length === 1 ? ' článek' : (list.length < 5 ? ' články' : ' článků'))
        };
      })(),
    };
  }
}
