<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Košík</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:300;src:url(img/ce9b1a0918863c84b2d777d718880298.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a,nav[aria-label="Hlavní menu"] button{outline:none !important}nav[aria-label="Hlavní menu"] a:hover,nav[aria-label="Hlavní menu"] button:hover{color:#00A151 !important;border-bottom-color:#00A151 !important;font-weight:600 !important}nav[aria-label="Hlavní menu"] a[style*="#F59700"]:hover{color:#F59700 !important}
a[style*="#F59700"]:hover{color:#F59700 !important;text-decoration:underline !important;text-decoration-color:#F59700 !important;text-underline-offset:3px;border-bottom-color:#F59700 !important}
nav[aria-label="Hlavní menu"] a[data-sale="true"],nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{color:#F59700 !important}nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{font-weight:600 !important;text-decoration:none !important;border-bottom-color:#F59700 !important}
</style>
</helmet>
<div style="font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff; width: 100%; min-width: 0">

<!-- TOP BAR -->
<div style="background: #000; color: #fff; font-size: 13px; line-height: 18px">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px">
<span>Oficiální distributor Carhartt WIP pro ČR &amp; SK</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 20px"><span>Objednej do 12:00, doručíme další pracovní den</span><span>Panská 7, Praha · Po–So 10–19 · Ne 10–18</span></span>
</div>
</div>

<!-- HEADER -->
<header onMouseLeave="{{closeMega}}" style="border-bottom: 1px solid #ddd">
<div style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 560px) minmax(0, 1fr); align-items: center; gap: 16px 32px">
<a href="index.html" aria-label="Cartoon – úvod" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; justify-self: start">
<img src="img/6b673a984f403c01ecd9985d2700a26c.svg" alt="cartoon" style="width: 150px; height: auto; display: block">
</a>
<form style="display: flex; width: 100%; border: 1px solid #000; box-sizing: border-box">
<label for="hq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat</label>
<input id="hq" type="search" placeholder="vyhledej co chceš" style="flex: 1 1 auto; min-width: 0; border: 0; padding: 12px 14px; font-family: FKGrotesk, sans-serif; font-size: 15px">
<button type="submit" aria-label="Hledat" style="width: 48px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<div style="display: flex; gap: 4px; justify-self: end">
<a href="#" aria-label="Měna CZK / EUR" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9a4 4 0 1 0 0 6"></path></svg></a>
<a href="kontakt.html" aria-label="Kontakt" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
<a href="#" aria-label="Můj účet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
<a href="#" aria-label="Košík, 0 položek" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 6px; right: 4px; min-width: 16px; height: 16px; background: #000; color: #fff; font-size: 10px; line-height: 16px; text-align: center">0</span></a>
</div>
</div>
<div style="position: relative">
<nav aria-label="Hlavní menu" style="max-width: 1360px; margin: 0 auto; padding: 0 24px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 4px; font-size: 15px; line-height: 18px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="10">
<li>
<sc-if value="{{n.hasMenu}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{n.toggle}}" onMouseEnter="{{n.open}}" aria-expanded="{{n.expanded}}" aria-haspopup="true" style="{{n.style}}">{{n.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="{{n.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<sc-if value="{{n.isLink}}" hint-placeholder-val="{{ true }}"><a onMouseEnter="{{n.open}}" href="katalog.html" data-sale="{{n.sale}}" style="{{n.style}}">{{n.label}}</a></sc-if>
</li>
</sc-for>
</ul>
</nav>
<div style="background: #f4f4f4; border-top: 1px solid #ddd">
<ul style="max-width: 1360px; margin: 0 auto; padding: 0 24px; list-style: none; display: flex; flex-wrap: wrap; gap: 0 4px; font-size: 14px; line-height: 18px">
<li><a href="katalog.html" style="display: block; padding: 9px 10px; text-decoration: none">muži</a></li>
<li><a href="katalog.html" style="display: block; padding: 9px 10px; text-decoration: none">ženy</a></li>
<li><a href="katalog.html" style="display: block; padding: 9px 10px; text-decoration: none">unisex</a></li>
</ul>
</div>
<sc-if value="{{megaOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: #fff; border-top: 1px solid #000; border-bottom: 1px solid #ddd; box-shadow: 0 32px 48px rgba(0,0,0,0.14)">
<div style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 40px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px; position: relative">
<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">{{mega.title}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 24px; font-size: 17px; line-height: 22px">
<sc-for list="{{mega.cats}}" as="c" hint-placeholder-count="8"><li><a href="katalog.html" style="display: block; padding: 8px 0; text-decoration: none">{{c}}</a></li></sc-for>
</ul>
<a href="katalog.html" style="font-weight: 600">{{mega.all}} <span class="arr">→</span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">Pro koho</h3>
<a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Muži</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Ženy</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Unisex</a>
<h3 style="margin: 16px 0 4px; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">Rychle</h3>
<a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Novinky</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0; color: #F59700; font-weight: 700">Výprodej</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">Značky</h3>
<a href="carhartt-wip-praha.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Carhartt WIP</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">The Dudes</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Iriedaily</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Edwin</a><a href="katalog.html" style="text-decoration: none; font-size: 17px; padding: 4px 0">Stetson</a>
</div>
<a href="katalog.html" style="position: relative; background: #293038; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 20px; min-height: 260px">
<img src="{{mega.promoImg}}" alt="" loading="lazy" style="{{mega.promoStyle}}"><span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0) 70%)"></span>
<span style="position: relative; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">{{mega.promoKicker}}</span>
<span style="position: relative; font-size: 22px; line-height: 26px; font-weight: 700">{{mega.promo}} <span class="arr">→</span></span>
</a>
<button type="button" onClick="{{closeMega}}" aria-label="Zavřít menu" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</header>

<!-- KROKY OBJEDNÁVKY -->
<nav aria-label="Kroky objednávky" style="border-bottom: 1px solid #ddd">
<ol style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 15px; line-height: 20px">
<li aria-current="step" style="display: flex; align-items: center; gap: 10px; font-weight: 600; border-bottom: 3px solid #000; padding-bottom: 12px"><span style="width: 28px; height: 28px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px">1</span>Košík</li>
<li style="display: flex; align-items: center; gap: 10px; color: #555; border-bottom: 3px solid #e8eaeb; padding-bottom: 12px"><span style="width: 28px; height: 28px; border: 1px solid #8c8c8c; display: flex; align-items: center; justify-content: center; font-size: 14px">2</span>Dodací údaje</li>
<li style="display: flex; align-items: center; gap: 10px; color: #555; border-bottom: 3px solid #e8eaeb; padding-bottom: 12px"><span style="width: 28px; height: 28px; border: 1px solid #8c8c8c; display: flex; align-items: center; justify-content: center; font-size: 14px">3</span>Doprava a platba</li>
<li style="display: flex; align-items: center; gap: 10px; color: #555; border-bottom: 3px solid #e8eaeb; padding-bottom: 12px"><span style="width: 28px; height: 28px; border: 1px solid #8c8c8c; display: flex; align-items: center; justify-content: center; font-size: 14px">4</span>Shrnutí</li>
</ol>
</nav>

<section style="max-width: 1360px; margin: 0 auto; padding: 48px 24px 0; display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: flex-start">
<!-- POLOŽKY -->
<div style="flex: 3 1 600px; min-width: 0">
<h1 style="margin: 0 0 24px; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Košík <span style="font-size: 18px; font-weight: 400; color: #555; letter-spacing: 0; vertical-align: top">{{countLabel}}</span></h1>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #000; padding: 48px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">Košík je prázdný</h2>
<button type="button" onClick="{{restore}}" style="min-height: 52px; padding: 0 28px; background: #000; color: #fff; border: 0; font-family: FKGrotesk, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Vrátit položky (ukázka)</button>
</div>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #000">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<li style="display: flex; gap: 20px; padding: 20px 0; border-bottom: 1px solid #ddd">
<a href="#" style="flex: 0 0 120px; aspect-ratio: 4 / 5; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; text-decoration: none; position: relative; overflow: hidden"><img src="{{it.img}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block"></a>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 16px">
<div><div style="font-size: 13px; color: #555">{{it.type}}</div><h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600"><a href="produkt.html" style="text-decoration: none">{{it.name}}</a></h2></div>
<div style="font-size: 18px; font-weight: 700; white-space: nowrap">{{it.lineTotal}}</div>
</div>
<dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; color: #555"><div style="display: flex; gap: 6px"><dt>Barva:</dt><dd style="margin: 0; color: #000">{{it.color}}</dd></div><div style="display: flex; gap: 6px"><dt>Velikost:</dt><dd style="margin: 0; color: #000">{{it.size}}</dd></div><div style="display: flex; gap: 6px"><dt>Cena/ks:</dt><dd style="margin: 0; color: #000">{{it.unit}}</dd></div></dl>
<div style="display: flex; align-items: center; gap: 16px; margin-top: auto">
<div role="group" aria-label="Počet kusů" style="display: flex; align-items: center; border: 1px solid #000">
<button type="button" onClick="{{it.dec}}" aria-label="Ubrat kus" style="width: 44px; height: 44px; background: #fff; border: 0; font-size: 20px; cursor: pointer">−</button>
<span aria-live="polite" style="min-width: 32px; text-align: center; font-weight: 600">{{it.qty}}</span>
<button type="button" onClick="{{it.inc}}" aria-label="Přidat kus" style="width: 44px; height: 44px; background: #fff; border: 0; font-size: 20px; cursor: pointer">+</button>
</div>
<span style="font-size: 14px; color: #00753b; font-weight: 600">Skladem</span>
<button type="button" onClick="{{it.remove}}" style="margin-left: auto; min-height: 44px; background: none; border: 0; font-family: FKGrotesk, sans-serif; font-size: 14px; text-decoration: underline; cursor: pointer">Odstranit</button>
</div>
</div>
</li>
</sc-for>
</ul>
<a href="katalog.html" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; min-height: 44px; font-weight: 600">← Pokračovat v nákupu</a>
</div>

<!-- SHRNUTÍ -->
<aside aria-labelledby="sum-h" style="flex: 2 1 380px; min-width: 0; position: sticky; top: 24px; background: #f4f4f4; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<h2 id="sum-h" style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">Shrnutí objednávky</h2>
<div style="background: #fff; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px">
<span><b>Doprava zdarma</b> – [podmínka dopravy zdarma, např. nad X Kč]</span>
<span style="height: 4px; background: #e8eaeb; position: relative; display: block"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: {{accent}}"></span></span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; font-size: 16px">
<dt>Mezisoučet</dt><dd style="margin: 0; text-align: right">{{subtotal}}</dd>
<sc-if value="{{codeApplied}}" hint-placeholder-val="{{ false }}"><dt>Slevový kód</dt><dd style="margin: 0; text-align: right; color: #c4301a">−[sleva] Kč</dd></sc-if>
<dt>Doprava</dt><dd style="margin: 0; text-align: right">v dalším kroku</dd>
<dt style="font-size: 20px; font-weight: 700; padding-top: 12px; border-top: 1px solid #000">Celkem</dt><dd style="margin: 0; text-align: right; font-size: 20px; font-weight: 700; padding-top: 12px; border-top: 1px solid #000">{{total}}</dd>
</dl>
<div style="font-size: 13px; color: #555; margin-top: -10px; text-align: right">vč. DPH</div>
<form style="display: flex; flex-direction: column; gap: 8px">
<label for="code" style="font-size: 14px; font-weight: 600">Slevový kód nebo dárkový poukaz</label>
<div style="display: flex; gap: 8px">
<input id="code" placeholder="Kód" style="flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px">
<button type="button" onClick="{{applyCode}}" style="min-height: 48px; padding: 0 18px; background: #fff; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{codeLabel}}</button>
</div>
</form>
<a href="dodaci-udaje.html" style="min-height: 56px; background: #00A151; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 17px; font-weight: 600">Pokračovat k údajům <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<li>Osobní odběr v Panské 7 zdarma – vyzkoušíš si na místě</li>
<li>Objednej do 12:00, doručíme další pracovní den</li>
<li>Vrácení do 14 dní · originál od oficiálního distributora</li>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><img src="img/pay/visa-black.svg" alt="Visa" style="height: 34px; width: auto; display: block"><img src="img/pay/mastercard-black.svg" alt="Mastercard" style="height: 34px; width: auto; display: block"><img src="img/pay/applepay-black.svg" alt="Apple Pay" style="height: 34px; width: auto; display: block"><img src="img/pay/googlepay-black.svg" alt="Google Pay" style="height: 34px; width: auto; display: block"></div>
</aside>
</section>

<!-- MOHLO BY SE HODIT -->
<section aria-labelledby="x-h" style="max-width: 1360px; margin: 0 auto; padding: 112px 24px 112px">
<h2 id="x-h" style="margin: 0 0 24px; font-size: 32px; line-height: 1.2; font-weight: 600">K objednávce se hodí</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cross}}" as="p" hint-placeholder-count="5">
<div style="position: relative">
<a href="produkt.html" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #000">
<div style="position: relative; aspect-ratio: 4 / 5; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 13px; overflow: hidden"><img src="{{p.img}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block">
<sc-if value="{{p.isNew}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 12px; left: 12px; background: #00A151; color: #fff; font-size: 12px; line-height: 16px; padding: 4px 8px; font-weight: 600">Novinka</span></sc-if>
<sc-if value="{{p.inStock}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: 12px; bottom: 12px; right: 12px; font-size: 12px; line-height: 16px; color: #000">{{p.sizes}}</span></sc-if>
<sc-if value="{{p.soldOut}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; background: rgba(255,255,255,0.6); display: flex; align-items: flex-end; padding: 12px; font-size: 13px; font-weight: 600; color: #000">Vyprodáno</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; line-height: 18px; color: #555">{{p.type}} {{p.brand}}</div>
