<div style="display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 24px 0"><div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px"><span style="width: 32px; height: 4px; background: #00A151"></span>Oficiální distributor</div><h1 id="di-h" style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em">Carhartt WIP<br>pro Česko a Slovensko</h1><p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2d2d2d; max-width: 560px">Cartoon-Shop je oficiální distributor značky Carhartt WIP pro Českou republiku a Slovensko. U nás koupíš originální streetwear a workwear, aktuální kolekce i limitované kousky – online i v prodejně Panská 7 v Praze.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px"><a href="carhartt-wip-praha.html" style="min-height: 52px; padding: 0 24px; background: #00A151; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 600; box-sizing: border-box">Nakupovat Carhartt WIP <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><a href="#partneri" style="min-height: 52px; padding: 0 24px; border: 2px solid #000; color: #000; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; box-sizing: border-box">Kontakt pro partnery</a></div></div>

</section>
