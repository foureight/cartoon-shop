<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Mobilní menu – Oblečení</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
div[aria-label="Oddělení"] button:hover{color:#00A151 !important}
nav[aria-label="Oblečení – podkategorie"] a:hover{color:#00A151 !important}
</style>
</helmet>
<div style="width: 100%; min-height: 844px; font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff">

<div style="padding: 12px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #ddd">
<a href="menu.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; text-decoration: none; font-size: 15px; font-weight: 600; margin-right: auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Zpět</a>
<a href="index.html" aria-label="Zavřít menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div role="group" aria-label="Oddělení" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #ddd">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>

<div style="padding: 18px 16px 4px">
<div style="font-size: 13px; color: #555">{{genderLabel}}</div>
<h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600">Oblečení</h2>
<a href="katalog.html" style="display: inline-block; margin-top: 6px; font-size: 15px; font-weight: 600">Zobrazit vše v Oblečení <span class="arr">→</span></a>
</div>

<nav aria-label="Oblečení – podkategorie">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="padding: 18px 16px 0">
<h3 style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid #000; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">{{g.h}}</h3>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{g.items}}" as="c" hint-placeholder-count="6"><li style="border-bottom: 1px solid #ddd"><a href="katalog.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; text-decoration: none; font-size: 17px; line-height: 22px; font-weight: 600">{{c}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a></li></sc-for>
</ul>
</section>
</sc-for>
</nav>

<a href="katalog.html" style="margin: 24px 16px 0; position: relative; overflow: hidden; background: #293038; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 16px; min-height: 160px">
<img src="img/e1e19d0db68f51c166db4eac23d226de.jpg" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: center"><span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0) 80%)"></span>
<span style="position: relative; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">Inspirace</span>
<span style="position: relative; font-size: 22px; line-height: 26px; font-weight: 700">Outfity</span>
<span style="position: relative; font-size: 15px; font-weight: 600">Prohlédnout <span class="arr">→</span></span>
</a>

<section aria-labelledby="mb2-h" style="padding: 24px 16px 36px">
<h3 id="mb2-h" style="margin: 0 0 10px; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">Oblečení podle značky</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="carhartt-wip-praha.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">Carhartt WIP</a>
<a href="katalog.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">Edwin</a>
<a href="katalog.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">IrieDaily</a>
<a href="katalog.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">Stetson</a>
<a href="katalog.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">The Dudes</a>
</div>
</section>

</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1850}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 2 };
  }
  renderVals() {
    const T = ['Muži', 'Ženy', 'Vše'];
    const tab = this.state.tab;
    return {
      genderLabel: ['Muži', 'Ženy', 'Muži i ženy'][tab],
      tabs: T.map((t, i) => {
        const on = tab === i;
        return { label: t, pressed: on ? 'true' : 'false',
          style: 'min-height:48px;background:#fff;border:0;border-bottom:3px solid ' + (on ? '#00A151' : 'transparent') + ';font-family:FKGrotesk,sans-serif;font-size:16px;cursor:pointer;' + (on ? 'color:#00A151;font-weight:700' : 'color:#000;font-weight:700'),
          pick: () => this.setState({ tab: i }) };
      }),
      groups: [
        { h: 'Horní díly', items: ['Trička', 'Polo trička', 'Mikiny s kapucí', 'Mikiny bez kapuce', 'Košile', 'Svetry'] },
        { h: 'Kalhoty', items: ['Jeans / denim', 'Work', 'Chinos', 'Cargo / kapsáče', 'Lacláče', 'Manžestr', 'Tepláky'] },
        { h: 'Bundy a vesty', items: ['Bundy', 'Kabáty a parky', 'Pullovery', 'Linery', 'Vesty'] },
        { h: 'Ostatní', items: ['Kraťasy', 'Plavky', 'Spodní prádlo'] }
      ]
    };
  }
}
</script>
</body>
</html>
