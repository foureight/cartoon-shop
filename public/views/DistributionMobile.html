<section aria-labelledby="di-h" style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px"><span style="width: 32px; height: 4px; background: #00A151"></span>Oficiální distributor</div><h1 id="di-h" style="margin: -12px 0 0; font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Carhartt WIP pro Česko a Slovensko</h1><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #2d2d2d">Cartoon-Shop je oficiální distributor značky Carhartt WIP pro Českou republiku a Slovensko. U nás koupíš originální streetwear a workwear, aktuální kolekce i limitované kousky – online i v prodejně Panská 7 v Praze.</p><div style="aspect-ratio: 4 / 3; position: relative; overflow: hidden; background: #ddd"><img src="img/2672d3e49af6de9d2095ed10a393cbd8.jpg" alt="Carhartt WIP Vista" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 75% center; display: block"></div><div style="display: flex; flex-direction: column; gap: 10px"><a href="carhartt-wip-praha.html" style="min-height: 52px; padding: 0 24px; background: #00A151; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 600; box-sizing: border-box">Nakupovat Carhartt WIP <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><a href="#partneri-m" style="min-height: 52px; padding: 0 24px; border: 2px solid #000; color: #000; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; box-sizing: border-box">Kontakt pro partnery</a></div></section>
