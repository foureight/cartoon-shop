<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Cartoon-Shop – homepage mobil</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:300;src:url(img/ce9b1a0918863c84b2d777d718880298.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
input[type="checkbox"],input[type="radio"]{accent-color:#00A151 !important}
@keyframes heroFill{from{width:0}to{width:100%}}
</style>
</helmet>
<div style="width: 100%; font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff; overflow: hidden">

<div style="background: #000; color: #fff; font-size: 12px; line-height: 16px; padding: 8px 16px; text-align: center">Objednej do 12:00, doručíme další pracovní den</div>

<!-- HEADER -->
<header style="border-bottom: 1px solid #ddd; background: #fff">
<div style="padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 4px">
<a href="#" aria-label="Cartoon – úvod" style="display: flex; flex-direction: column; gap: 3px; text-decoration: none; margin-right: auto">
<img src="img/6b673a984f403c01ecd9985d2700a26c.svg" alt="cartoon" style="width: 108px; height: auto; display: block">
</a>
<a href="#" aria-label="Můj účet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
<a href="kosik.html" aria-label="Košík, 0 položek" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 6px; right: 4px; min-width: 16px; height: 16px; background: #000; color: #fff; font-size: 10px; line-height: 16px; text-align: center">0</span></a>
<a href="menu.html" aria-label="Otevřít menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
</div>
<form style="margin: 0 16px 12px; display: flex; border: 1px solid #000">
<label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat</label>
<input id="mq" type="search" placeholder="vyhledej co chceš" style="flex: 1 1 auto; min-width: 0; border: 0; padding: 12px 14px; font-family: FKGrotesk, sans-serif; font-size: 16px">
<button type="submit" aria-label="Hledat" style="width: 48px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
</header>

<!-- HERO (H1) -->
<section aria-label="Hlavní novinky" style="background: #293038; color: #fff">
<div style="margin: 16px 16px 0; aspect-ratio: 4 / 3; background: #3a434d; position: relative; overflow: hidden"><img src="img/c52d6116ce559e7e46ff504859f3b877.webp" alt="Kampaň Carhartt WIP" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 50%"></div>
<div style="padding: 24px 16px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 28px; height: 4px; background: {{accent}}"></span>{{slide.kicker}}</div>
<h1 style="margin: 0; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; white-space: pre-line">{{slide.title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #e8eaeb">{{slide.text}}</p>
<a href="carhartt-wip-praha.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #fff; color: #000; text-decoration: none; font-weight: 600">{{slide.cta}} <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<div role="group" aria-label="Snímky" style="display: flex; justify-content: center; gap: 8px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><button type="button" onClick="{{d.go}}" aria-label="{{d.label}}" aria-current="{{d.cur}}" style="width: 44px; height: 32px; padding: 0; background: none; border: 0; display: flex; align-items: center; cursor: pointer"><span style="position: relative; display: block; width: 100%; height: 3px; background: rgba(255,255,255,0.35); overflow: hidden"><span style="{{d.fill}}"></span></span></button></sc-for></div>
</div>
</section>

<!-- KATEGORIE -->
<section aria-labelledby="mk-h" style="padding: 40px 0 0">
<h2 id="mk-h" style="margin: 0 16px 14px; font-size: 20px; line-height: 1.3; font-weight: 600">Nakupuj podle kategorie</h2>
<div style="display: flex; gap: 10px; overflow-x: auto; margin: 0 0 0 16px; padding: 0 16px 0 0">
<sc-for list="{{categories}}" as="c" hint-placeholder-count="6">
<a href="katalog.html" style="flex: 0 0 124px; display: flex; flex-direction: column; text-decoration: none; color: #000; border: 1px solid #ddd">
<div style="aspect-ratio: 1 / 1; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px; position: relative; overflow: hidden"><img src="{{c.img}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block"></div>
<h3 style="margin: 0; padding: 10px 12px; font-size: 16px; line-height: 1.4; font-weight: 600">{{c.label}}</h3>
</a>
</sc-for>
</div>
</section>

<!-- AKTUALITY -->
<section aria-labelledby="ma-h" style="padding: 60px 16px 0">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px"><span style="width: 28px; height: 4px; background: {{accent}}"></span>Co se děje</div>
<h2 id="ma-h" style="margin: 0 0 18px; font-size: 24px; line-height: 1.2; font-weight: 600">Aktuality na webu</h2>
<a href="produkt.html" style="display: block; position: relative; aspect-ratio: 4 / 5; background: #f4f4f4; text-decoration: none"><img src="img/14b9bb6e42156f0e51845a54e838b3d4.jpg" alt="Kalhoty Carhartt WIP" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"><span style="position: absolute; left: 0; right: 0; bottom: 0; background: #000; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center"><span><span style="display: block; font-size: 12px; line-height: 16px; color: #ddd">Carhartt WIP</span><h3 style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600">Kalhoty Newel jsou zpět</h3></span><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px">
<a href="#" style="position: relative; aspect-ratio: 1 / 1; background: #f4f4f4; overflow: hidden; text-decoration: none"><img src="img/5aa16c0daa3a266df57b6ad7947ed508.jpg" alt="Dva lidé v oblečení Carhartt WIP" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"><span style="position: absolute; left: 0; bottom: 0; background: #fff; padding: 8px 10px"><h3 style="margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; white-space: nowrap">Akce kachna</h3></span></a>
<a href="katalog.html" style="position: relative; aspect-ratio: 1 / 1; background: #f4f4f4; overflow: hidden; text-decoration: none"><img src="img/2d9d2ebfd3f145128c91ac8b7ac55a5f.jpg" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block"><span style="position: absolute; left: 0; bottom: 0; background: #fff; padding: 8px 10px"><h3 style="margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; white-space: nowrap">Bundy pro holky</h3></span></a>
<a href="#" style="position: relative; aspect-ratio: 1 / 1; background: #f4f4f4; overflow: hidden; text-decoration: none"><img src="img/f6090f407b8e846de4e119ab3b13a535.jpg" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"><span style="position: absolute; left: 0; bottom: 0; background: #fff; padding: 8px 10px"><h3 style="margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; white-space: nowrap">Dámská kolekce</h3></span></a>
<a href="#" style="position: relative; aspect-ratio: 1 / 1; background: #f4f4f4; overflow: hidden; text-decoration: none"><img src="img/edff7776f33714eb20cf83ebf5067b7f.jpg" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"><span style="position: absolute; left: 0; bottom: 0; background: #fff; padding: 8px 10px"><h3 style="margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; white-space: nowrap">Jaro plné barev</h3></span></a>
</div>
</section>

<!-- PROČ CARTOON -->
<section aria-labelledby="mp-h" style="padding: 60px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 28px; height: 4px; background: {{accent}}"></span>Panská 7 = Cartoon</div>
<h2 id="mp-h" style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600">Proč měníme název na Cartoon?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65">Obchod cartoon-shop.cz v Panské 7 znáte léta. Pod jedním jménem teď spojujeme kamennou prodejnu i e-shop – stejný tým, stejné značky, stejná adresa.</p>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #000; color: #fff; text-decoration: none; font-weight: 600">Více o změně</a>
</section>

<!-- KOLEKCE -->
<section aria-labelledby="mc-h" style="background: #000; color: #fff">
<div style="margin: 16px 16px 0; aspect-ratio: 4 / 3; background: #2d2d2d; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; position: relative; overflow: hidden"><img src="img/e1e19d0db68f51c166db4eac23d226de.jpg" alt="Carhartt WIP jaro / léto 2026" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"></div>
<div style="padding: 28px 16px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 28px; height: 4px; background: {{accent}}"></span>Nová kolekce</div>
<h2 id="mc-h" style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600">Carhartt WIP<br>jaro / léto 2026</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #ddd">Nové střihy, sezónní barvy a návrat ikonických modelů.</p>
<a href="carhartt-wip-praha.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #fff; color: #000; text-decoration: none; font-weight: 600">Prohlédnout kolekci</a>
</div>
</section>

<!-- PRODUKTOVÉ ŘADY – karusely po 4 -->
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<section aria-label="{{r.title}}" style="padding: 60px 0 0">
<div style="padding: 0 16px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px"><span style="width: 28px; height: 4px; background: {{r.bar}}"></span>{{r.kicker}}</div>
<h2 style="margin: 0 0 8px; font-size: 24px; line-height: 1.2; font-weight: 600">{{r.title}}</h2>
<p style="margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: #2d2d2d">{{r.text}}</p>
</div>
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 0 0 16px; padding: 0 16px 0 0; scroll-snap-type: x mandatory; scroll-padding-left: 0">
<sc-for list="{{r.products}}" as="p" hint-placeholder-count="4">
<a href="produkt.html" style="flex: 0 0 240px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #000; scroll-snap-align: start">
<div style="position: relative; aspect-ratio: 4 / 5; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px; overflow: hidden"><img src="{{p.img}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block">
<span style="position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></span>
<span style="position: absolute; left: 8px; bottom: 8px; font-size: 11px; line-height: 14px; color: #000">{{p.sizesLabel}}</span>
<sc-if value="{{p.hasTag}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 8px; left: 8px; background: #00A151; color: #fff; font-size: 11px; line-height: 14px; padding: 4px 6px; font-weight: 600">{{p.tag}}</span></sc-if>
</div>
<div><div style="font-size: 12px; color: #555">{{p.brand}}</div><h3 style="margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; white-space: nowrap">{{p.name}}</h3></div>
<div style="font-size: 14px; font-weight: 600"><sc-if value="{{p.sale}}" hint-placeholder-val="{{ false }}"><s style="color: #555; font-weight: 400; margin-right: 6px">{{p.oldPrice}}</s><span style="color: #c4301a">{{p.price}}</span></sc-if><sc-if value="{{p.full}}" hint-placeholder-val="{{ true }}"><span>{{p.price}}</span></sc-if></div>
</a>
</sc-for>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin: 14px 16px 0"><span style="flex: 1 1 auto; height: 2px; background: #e8eaeb; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: #000"></span></span><span style="font-size: 12px; line-height: 16px; color: #555; white-space: nowrap; display: flex; align-items: center; gap: 4px">posuň pro další<svg class="arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></div>
<a href="katalog.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; margin: 14px 16px 0; border: 1px solid #000; text-decoration: none; font-weight: 600; font-size: 15px">{{r.link}} <span class="arr">→</span></a>
</section>
</sc-for>

</div>
<!-- DRUHÁ ČÁST HOMEPAGE (dříve samostatná šablona) -->
<div style="width: 100%; font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff; overflow: hidden">
<!-- NOVINKY Z PANSKÉ -->
<section aria-labelledby="mnp-h" style="padding: 60px 16px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px"><span style="width: 28px; height: 4px; background: {{accent}}"></span>Panská 7</div>
<h2 id="mnp-h" style="margin: 0 0 18px; font-size: 24px; line-height: 1.2; font-weight: 600">Novinky z Panské</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{news}}" as="nw" hint-placeholder-count="3">
<a href="novinka.html" style="display: flex; flex-direction: column; border: 1px solid #ddd; text-decoration: none; color: #000">
<span style="position: relative; display: block; aspect-ratio: 16 / 9; background: #f4f4f4; overflow: hidden"><img src="{{nw.photo}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"></span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px 16px"><span style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; gap: 10px; align-items: center; font-size: 12px; line-height: 16px"><span style="background: #000; color: #fff; padding: 2px 7px; font-weight: 600">{{nw.tag}}</span><span style="color: #555">{{nw.date}}</span></span><h3 style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600">{{nw.title}}</h3></span><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</sc-for>
</div>
<a href="novinky.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 14px; border: 1px solid #000; text-decoration: none; font-weight: 600; font-size: 15px">Všechny novinky <span class="arr">→</span></a>
</section>

<!-- NEWSLETTER -->
<section aria-labelledby="ml-h" style="background: #000; color: #fff; padding: 48px 16px">
<h2 id="ml-h" style="margin: 0 0 6px; font-size: 24px; line-height: 1.2; font-weight: 600">Přihlaš se do našeho mailingu</h2>
<p style="margin: 0 0 18px; color: #ddd">Novinky, nové dropy, SLEVY a akce jako první.</p>
<form style="display: flex; flex-direction: column; gap: 10px">
<label for="mnl" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">E-mail</label>
<input id="mnl" type="email" placeholder="tvuj@email.cz" style="min-height: 52px; padding: 0 16px; border: 0; font-family: FKGrotesk, sans-serif; font-size: 16px">
<button type="submit" style="min-height: 52px; background: {{accent}}; color: #fff; border: 0; font-family: FKGrotesk, sans-serif; font-size: 16px; font-weight: 600">Přihlásit se</button>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 18px; color: #ddd"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; flex: 0 0 auto">souhlasím se zpracováním údajů dle pravidel GDPR a chci být informován o novinkách, slevách a akcích</label>
</form>
</section>

<!-- ZNAČKY -->
<section aria-labelledby="mb-h" style="background: #f4f4f4; color: #000; padding: 48px 16px">
<h2 id="mb-h" style="margin: 0 0 16px; font-size: 20px; line-height: 1.3; font-weight: 600">Značky, které vedeme</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #ddd; border: 1px solid #ddd">
<a href="carhartt-wip-praha.html" style="grid-column: span 2; background: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #293038; font-size: 19px; font-weight: 600; letter-spacing: 0.02em">Carhartt WIP</a>
<a href="katalog.html" style="background: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #293038; font-size: 19px; font-weight: 600; letter-spacing: 0.02em">Iriedaily</a>
<a href="katalog.html" style="background: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #293038; font-size: 19px; font-weight: 600; letter-spacing: 0.02em">Edwin</a>
<a href="katalog.html" style="background: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #293038; font-size: 19px; font-weight: 600; letter-spacing: 0.02em">The Dudes</a>
<a href="katalog.html" style="background: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #293038; font-size: 19px; font-weight: 600; letter-spacing: 0.02em">Stetson</a>
</div>
</section>

<!-- FAQ -->
<section aria-labelledby="mf-h" style="border-top: 1px solid #ddd; padding: 48px 16px 60px">
<h2 id="mf-h" style="margin: 0 0 20px; font-size: 24px; line-height: 1.2; font-weight: 600">Časté dotazy</h2>
<div style="border-top: 1px solid #000">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="5">
