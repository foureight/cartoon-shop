<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Carhartt WIP Praha – Cartoon-Shop</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:300;src:url(img/ce9b1a0918863c84b2d777d718880298.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a,nav[aria-label="Hlavní menu"] button{outline:none !important}nav[aria-label="Hlavní menu"] a:hover,nav[aria-label="Hlavní menu"] button:hover{color:#00A151 !important;border-bottom-color:#00A151 !important;font-weight:600 !important}nav[aria-label="Hlavní menu"] a[style*="#F59700"]:hover{color:#F59700 !important}
a[style*="#F59700"]:hover{color:#F59700 !important;text-decoration:underline !important;text-decoration-color:#F59700 !important;text-underline-offset:3px;border-bottom-color:#F59700 !important}
input[type="checkbox"],input[type="radio"]{accent-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a[data-sale="true"],nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{color:#F59700 !important}nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{font-weight:600 !important;text-decoration:none !important;border-bottom-color:#F59700 !important}
div[aria-label="Oddělení"] button[aria-pressed="false"]:hover{border-color:#000 !important}div[aria-label="Oddělení"] button{outline:none !important}div[aria-label="Oddělení"] button:focus-visible{outline:2px solid #00A151 !important;outline-offset:-2px}
</style>
</helmet>
<div style="font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff; width: 100%; min-width: 0">

<!-- TOP BAR -->
<sc-if value="{{showTopbar}}" hint-placeholder-val="{{ true }}">
<div style="background: #000; color: #fff; font-size: 13px; line-height: 18px">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px">
<span>Oficiální distributor Carhartt WIP pro ČR &amp; SK</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 20px"><span>Panská 7, Praha</span><span>Po–So 10–19 · Ne 10–18</span><a href="tel:+420224267486" style="color: #fff; text-decoration: none">+420 224 267 486</a></span>
</div>
</div>
</sc-if>

<!-- HEADER (zachovaná struktura webu) -->
<header onMouseLeave="{{closeMega}}" style="border-bottom: 1px solid #ddd">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px; display: grid; grid-template-columns: auto minmax(240px, 1fr) auto; align-items: center; gap: 12px 24px">
<a href="index.html" aria-label="Cartoon – úvod" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none">
<img src="img/6b673a984f403c01ecd9985d2700a26c.svg" alt="cartoon" style="width: 150px; height: auto; display: block">
</a>
<div onMouseLeave="{{closeSearch}}" style="position: relative; width: 100%; max-width: 600px; justify-self: center">
<form role="search" style="display: flex; border: 1px solid #000; box-sizing: border-box">
<label for="hq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat</label>
<input id="hq" type="search" value="{{sq}}" onChange="{{onSq}}" onFocus="{{openSearch}}" autocomplete="off" aria-autocomplete="list" aria-controls="hq-sug" aria-expanded="{{sopenStr}}" placeholder="Co hledáš?" style="flex: 1 1 auto; min-width: 0; border: 0; padding: 10px 12px; font-family: FKGrotesk, sans-serif; font-size: 15px">
<button type="submit" aria-label="Hledat" style="width: 44px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<sc-if value="{{sopen}}" hint-placeholder-val="{{ false }}">
<div id="hq-sug" style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; width: auto; max-width: calc(100vw - 48px); box-sizing: border-box; background: #fff; border: 1px solid #000; box-shadow: 0 24px 40px rgba(0,0,0,0.14); padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{sEmpty}}" hint-placeholder-val="{{ true }}">
<div>
<h3 style="margin: 0 0 10px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Často hledané</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{sPopular}}" as="p" hint-placeholder-count="6"><button type="button" onClick="{{p.pick}}" style="min-height: 36px; padding: 0 12px; background: #fff; border: 1px solid #ddd; font-family: FKGrotesk, sans-serif; font-size: 14px; font-weight: 600; color: #000; cursor: pointer">{{p.t}}</button></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{sHasCats}}" hint-placeholder-val="{{ false }}">
<div>
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Kategorie a značky</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 15px; line-height: 20px">
<sc-for list="{{sCats}}" as="c" hint-placeholder-count="3"><li><a href="{{c.href}}" style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; text-decoration: none"><span>{{c.pre}}<b>{{c.hit}}</b>{{c.post}}</span><span style="color: #555; font-size: 13px">{{c.where}}</span></a></li></sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{sHasProds}}" hint-placeholder-val="{{ false }}">
<div>
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Produkty</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 15px; line-height: 20px">
<sc-for list="{{sProds}}" as="p" hint-placeholder-count="4"><li><a href="produkt.html" style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; text-decoration: none"><span>{{p.pre}}<b>{{p.hit}}</b>{{p.post}}</span><span style="color: #555; font-size: 13px">{{p.where}}</span></a></li></sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{sNone}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px">Pro „{{sq}}“ jsme nic nenašli. Zkus jiné slovo nebo projdi <a href="katalog.html">Novinky</a>.</p>
</sc-if>
<sc-if value="{{sTyped}}" hint-placeholder-val="{{ false }}">
<a href="katalog.html" style="border-top: 1px solid #ddd; padding-top: 12px; font-size: 15px; font-weight: 600">Zobrazit všechny výsledky pro „{{sq}}“ <span class="arr">→</span></a>
</sc-if>
</div>
</sc-if>
</div>
<div style="display: flex; gap: 4px; justify-self: end">
<a href="#" aria-label="Měna CZK / EUR" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9a4 4 0 1 0 0 6"></path></svg></a>
<a href="kontakt.html" aria-label="Kontakt" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
<a href="#" aria-label="Můj účet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
<a href="kosik.html" aria-label="Košík, 0 položek" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 6px; right: 4px; min-width: 16px; height: 16px; background: #000; color: #fff; font-size: 10px; line-height: 16px; text-align: center">0</span></a>
</div>
</div>
<div style="position: relative">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 24px">
<nav aria-label="Hlavní menu">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 16px; line-height: 20px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
<li>
<sc-if value="{{n.hasMenu}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{n.toggle}}" onMouseEnter="{{n.open}}" aria-expanded="{{n.expanded}}" aria-haspopup="true" style="{{n.style}}">{{n.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="{{n.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<sc-if value="{{n.isLink}}" hint-placeholder-val="{{ true }}"><a onMouseEnter="{{n.open}}" href="katalog.html" data-sale="{{n.sale}}" style="{{n.style}}">{{n.label}}</a></sc-if>
</li>
</sc-for>
</ul>
</nav>
<div role="group" aria-label="Oddělení" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0">
<sc-for list="{{genders}}" as="g" hint-placeholder-count="3"><button type="button" aria-pressed="{{g.pressed}}" aria-label="{{g.aria}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}<sc-if value="{{g.x}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-size: 16px; line-height: 1">×</span></sc-if></button></sc-for>
</div>
</div>
<sc-if value="{{megaOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: #fff; border-top: 1px solid #000; border-bottom: 1px solid #ddd; box-shadow: 0 32px 48px rgba(0,0,0,0.14)">
<div style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 36px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 32px; position: relative">
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; padding-right: 56px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700">{{mega.title}}</h2>
<span style="font-size: 14px; line-height: 20px; color: #555">{{genderLabel}}</span>
<a href="{{mega.allHref}}" style="font-size: 15px; font-weight: 600">{{mega.all}} <span class="arr">→</span></a>
</div>
<sc-if value="{{mega.isOutfits}}" hint-placeholder-val="{{ false }}">
<div style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 32px">
<sc-for list="{{mega.outfits}}" as="o" hint-placeholder-count="4">
<article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<a href="katalog.html" style="display: block; position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #f4f4f4; text-decoration: none"><img src="{{o.img}}" alt="{{o.alt}}" loading="lazy" style="{{o.imgStyle}}"></a>
<h3 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 700">{{o.name}}</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 18px; border-top: 1px solid #ddd">
<sc-for list="{{o.items}}" as="it" hint-placeholder-count="3"><li style="border-bottom: 1px solid #ddd"><a href="produkt.html" style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; text-decoration: none"><span>{{it.n}}</span><span style="white-space: nowrap; font-weight: 600">{{it.p}}</span></a></li></sc-for>
</ul>
<a href="kosik.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 12px; background: #000; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600">Koupit celý outfit<span>{{o.total}}</span></a>
</article>
</sc-for>
</div>
</sc-if>
<sc-for list="{{mega.cols}}" as="col" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h3 style="margin: 0 0 6px; font-size: 17px; line-height: 22px; font-weight: 700">{{col.h}}</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 16px; line-height: 20px">
<sc-for list="{{col.items}}" as="c" hint-placeholder-count="6"><li><a href="{{c.href}}" style="display: block; padding: 6px 0; text-decoration: none">{{c.t}}</a></li></sc-for>
</ul>
</div>
</sc-for>
<sc-if value="{{mega.tile}}" hint-placeholder-val="{{ true }}">
<a href="katalog.html" style="grid-column: 5; grid-row: 2; position: relative; overflow: hidden; background: #293038; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 20px; min-height: 300px">
<img src="{{mega.outfitImg}}" alt="" loading="lazy" style="{{mega.outfitStyle}}"><span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 45%, rgba(0,0,0,0) 70%)"></span>
<span style="position: relative; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">Inspirace</span>
<span style="position: relative; font-size: 24px; line-height: 28px; font-weight: 700">Outfity</span>
<span style="position: relative; font-size: 14px; line-height: 19px; color: #e8eaeb">{{mega.outfitText}}</span>
<span style="position: relative; font-size: 15px; font-weight: 600; margin-top: 4px">Prohlédnout <span class="arr">→</span></span>
</a>
</sc-if>
<button type="button" onClick="{{closeMega}}" aria-label="Zavřít menu" style="position: absolute; top: 16px; right: 12px; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</header>

<!-- BREADCRUMB -->
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px 0; font-size: 13px; color: #555">
<a href="index.html" style="color: #555">Úvod</a> / <span>Carhartt WIP Praha</span>
</div>

<!-- HERO -->
<section style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-wrap: wrap; gap: 40px; align-items: stretch">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 32px; height: 4px; background: {{accent}}"></span>Cartoon x Panská 7</div>
<h1 style="margin: 0; font-size: clamp(44px, 7vw, 96px); line-height: 0.95; font-weight: 700; letter-spacing: -0.02em">Carhartt WIP Praha</h1>
<p style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600">Největší výběr kolekce Carhartt v ČR</p>
<p style="margin: 0; font-size: 16px; line-height: 1.65; max-width: 560px">Mikiny, bundy, kalhoty, kraťasy, trička i doplňky – od ikonických workwear kousků až po aktuální streetwear kolekce. Navštiv kamennou prodejnu v centru Prahy nebo objednej online s rychlým doručením.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#kategorie" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 28px; background: #00A151; color: #fff; text-decoration: none; font-weight: 600; font-size: 16px">Nakupovat Carhartt WIP <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="#prodejna" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border: 2px solid #000; color: #000; text-decoration: none; font-weight: 600; font-size: 16px; box-sizing: border-box">Navštivit prodejnu</a>
</div>
</div>
<div style="flex: 1 1 520px; min-width: 0; min-height: 520px; background: #ddd; position: relative; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; text-align: center; box-sizing: border-box; overflow: hidden"><img src="img/8edb0855b1832c7b8196a30612b05768.jpg" alt="Panoramatická fotka prodejny Cartoon, Panská 7" draggable="false" style="{{panStyle}}"><div style="position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.78); color: #fff; padding: 6px 8px; font-size: 12px; line-height: 16px; font-weight: 600"><button type="button" onClick="{{panLeft}}" aria-label="Posunout panorama doleva" style="width: 36px; height: 36px; border: 0; background: #fff; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center">←</button><input type="range" min="0" max="100" step="1" value="{{panVal}}" onChange="{{panInput}}" aria-label="Projdi celý obchod" style="width: 140px; accent-color: #00A151; cursor: ew-resize"><button type="button" onClick="{{panRight}}" aria-label="Posunout panorama doprava" style="width: 36px; height: 36px; border: 0; background: #fff; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center">→</button></div>
<div style="position: absolute; left: 0; bottom: 0; background: #000; color: #fff; padding: 16px 20px; text-align: left; font-size: 14px; line-height: 20px"><div style="font-weight: 600">Panská 7, Praha</div><div>Dnes otevřeno 10:00–19:00</div></div>
</div>
</section>

<!-- USP STRIP -->
<section aria-label="Proč u nás" style="border-top: 1px solid #ddd; border-bottom: 1px solid #ddd">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))">
<div style="padding: 24px 20px 24px 0; display: flex; gap: 14px; align-items: flex-start"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg><div><div style="font-weight: 600">Oficiální distributor</div><div style="font-size: 14px; line-height: 20px; color: #555">Carhartt WIP pro ČR &amp; SK, garance originality</div></div></div>
<div style="padding: 24px 20px 24px 0; display: flex; gap: 14px; align-items: flex-start"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 10l9-6 9 6"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg><div><div style="font-weight: 600">Kamenná prodejna</div><div style="font-size: 14px; line-height: 20px; color: #555">V centru Prahy, s možností vyzkoušení</div></div></div>
<div style="padding: 24px 20px 24px 0; display: flex; gap: 14px; align-items: flex-start"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex: 0 0 auto"><rect x="4" y="5" width="16" height="15"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><div><div style="font-weight: 600">Rezervace online</div><div style="font-size: 14px; line-height: 20px; color: #555">Vyzvedni osobně v Panské 7</div></div></div>
<div style="padding: 24px 20px 24px 0; display: flex; gap: 14px; align-items: flex-start"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex: 0 0 auto"><path d="M4 7h16M4 12h16M4 17h10"></path></svg><div><div style="font-weight: 600">Kompletní velikosti</div><div style="font-size: 14px; line-height: 20px; color: #555">Ikonické modely skladem celoročně</div></div></div>
</div>
</section>

<!-- KATEGORIE -->
<section id="kategorie" style="max-width: 1360px; margin: 0 auto; padding: 88px 24px 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 28px">
<h2 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600">Nakupuj podle kategorie</h2>
<a href="katalog.html" style="font-weight: 600">Celá kolekce Carhartt WIP <span class="arr">→</span></a>
</div>

          onSq: e => this.setState({ sq: e && e.target ? e.target.value : '', sopen: true, mega: null }),
          openSearch: () => this.setState({ sopen: true, mega: null }),
          closeSearch: () => this.setState({ sopen: false }),
          genderLabel: gen === 'vse' ? 'Muži i ženy' : (gen === 'panske' ? 'Muži' : 'Ženy'),
          genders: G.map(([k, l], i) => { const on = gen === k; const x = on && k !== 'vse';
            return { label: l, x, pressed: on ? 'true' : 'false', aria: x ? l + ' – zrušit výběr' : l,
            style: gbase + (on ? 'color:#fff;background:#000;border:1px solid #000;' : 'color:#000;background:#fff;border:1px solid #ddd;'),
            pick: () => this.setState({ gen: x ? 'vse' : k }) }; }),
          navItems: N.map(([k, l, sub]) => {
            const open = mg === k; const isCur = cur === k; const sale = k === 'slevy';
            const on = open || (isCur && !mg);
            return { label: l, sale: sale ? 'true' : 'false', hasMenu: !!sub, isLink: !sub, expanded: open ? 'true' : 'false',
              style: base + 'color:' + (sale ? '#F59700' : (on ? '#00A151' : '#000')) + ';' + 'border-bottom:3px solid ' + (on ? (sale ? '#F59700' : '#00A151') : 'transparent') + ';',
              chev: 'transform:rotate(' + (open ? '180deg' : '0deg') + ')',
              toggle: () => this.setState({ mega: open ? null : k, sopen: false }),
              open: () => this.setState({ mega: sub ? k : null, sopen: false }) };
          })
        };
      })(),
      accent: this.props.accent ?? '#00A151',
      showTopbar: this.props.showTopbar ?? true,
      categories: [
        { label: 'Mikiny' }, { label: 'Bundy' }, { label: 'Kalhoty' },
        { label: 'Kraťasy' }, { label: 'Trička' }, { label: 'Doplňky' }
      ],
      bestsellers: [
        { name: 'Double Knee Pant', note: 'Ikonické pracovní kalhoty', tag: 'Ikona' },
        { name: 'Michigan Coat', note: 'Bunda s manšestrovým límcem', tag: 'Ikona' },
        { name: 'Chase Hoodie & Crewneck', note: 'Mikiny s malým logem', tag: 'Bestseller' },
        { name: 'Script T-Shirt', note: 'Trička s nápisem Carhartt', tag: 'Bestseller' },
        { name: 'Sezónní bundy', note: 'Jaro / zima', tag: 'Sezóna' }
      ],
      faqs: faqData.map((f, i) => ({
        q: f.q, a: f.a,
        open: open === i,
        expanded: open === i ? 'true' : 'false',
        sign: open === i ? '−' : '+',
        toggle: () => this.setState({ open: open === i ? -1 : i })
      }))
    };
  }
}
