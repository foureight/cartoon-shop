<section style="background: #293038; color: #fff; margin-top: 16px">
<div style="max-width: 1360px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Od workwearu ke streetwearu</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #e8eaeb; max-width: 620px">Příběh začal v roce 1889 v Detroitu, kdy Hamilton Carhartt založil firmu na odolné pracovní oblečení pro dělníky na železnicích. Dnes je Carhartt WIP jednou z nejvlivnějších streetwearových značek na světě.</p>
</div>
<div style="flex: 1 1 420px; min-width: 0; min-height: 420px; background: #3a434d; display: flex; align-items: center; justify-content: center; color: #ddd; font-size: 13px; text-align: center; padding: 16px; box-sizing: border-box; position: relative; overflow: hidden"><img src="img/2672d3e49af6de9d2095ed10a393cbd8.jpg" alt="Carhartt WIP" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 75% center; display: block"></div>
</div>
</section>
<section aria-label="Klíčová data" style="border-bottom: 1px solid #ddd">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="padding: 24px 0; border-right: 1px solid #ddd; padding-right: 24px"><div style="font-size: 44px; line-height: 44px; font-weight: 700">1889</div><div style="font-size: 15px; color: #555; margin-top: 6px">založení v Detroitu</div></div>
<div style="padding: 24px 0; border-right: 1px solid #ddd; padding: 24px"><div style="font-size: 44px; line-height: 44px; font-weight: 700">1994</div><div style="font-size: 15px; color: #555; margin-top: 6px">vzniká Carhartt Work In Progress</div></div>
<div style="padding: 24px 0; padding: 24px"><div style="font-size: 44px; line-height: 44px; font-weight: 700">100+</div><div style="font-size: 15px; color: #555; margin-top: 6px">prodejen v Evropě, Asii a USA</div></div>
</div>
</section>
<section style="max-width: 1360px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-wrap: wrap; gap: 28px 56px; align-items: flex-start">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600">Od amerického workwearu k vlastní identitě</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Původní Carhartt byl navržen pro extrémní podmínky – pevné plátno, trojité švy a maximální funkčnost. Tahle odolnost se postupně stala inspirací pro městskou kulturu, skate scénu i hudební subkultury.</p><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Carhartt Work In Progress založil v roce 1994 Edwin Faeh. Ikonické modely značky Carhartt upravuje a přetváří do vlastních kolekcí – žluté „C“ si dnes lidé spojují s hiphopovými klipy z konce 90. let a skate videi stejně jako s továrnami a manuální prací.</p>
</div>
<div style="flex: 1 1 440px; min-width: 0; aspect-ratio: 4 / 3; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 13px; text-align: center; padding: 16px; box-sizing: border-box; position: relative; overflow: hidden"><img src="img/656a5846ee836a633f5b3ea36a547886.jpg" alt="Carhartt WIP Double Knee Pant" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; display: block"></div>
</section>
<section style="max-width: 1360px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-wrap: wrap; flex-direction: row-reverse; gap: 28px 56px; align-items: flex-start">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600">Kultura, města a globální komunita</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Carhartt WIP čerpá z propojených techno scén Detroitu a Berlína, ze skateboardingu mezi Paříží, New Yorkem a Soulem i ze současného umění. Tyto vlivy přetavuje do vlastního jazyka kolekcí, vizuální komunikace i výběru partnerů.</p><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Dnes provozuje více než 100 kamenných prodejen v Evropě, Asii a USA a spolupracuje s pečlivě vybranými partnery po celém světě.</p>
</div>
<div style="flex: 1 1 440px; min-width: 0; aspect-ratio: 4 / 3; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 13px; text-align: center; padding: 16px; box-sizing: border-box; position: relative; overflow: hidden"><img src="img/f6090f407b8e846de4e119ab3b13a535.jpg" alt="Carhartt WIP v ulicích" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block"></div>
</section>
<section aria-labelledby="tl-h" style="max-width: 1360px; margin: 0 auto; padding: 128px 24px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 32px; height: 4px; background: {{accent}}"></span>Časová osa</div>
<h2 id="tl-h" style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600">Historie Carhartt od roku 1855</h2>

      prevEra: () => this.setState({ era: Math.max(0, e - 1) }), nextEra: () => this.setState({ era: Math.min(ERAS.length - 1, e + 1) }),
    };
  }
}
</script>
</body>
