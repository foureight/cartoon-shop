        showCard: on && i === 0, showWallet: on && i === 1, showTransfer: on && i === 2, showStore: on && i === 3,
        pick: () => dis ? null : this.setState({ pay: i }) }; }),
      payNote: st.ship !== 0 && st.pay === 3,
