</div>

<div style="display: flex; flex-direction: column; gap: 8px">

</sc-if>

<sc-if value="{{a.open}}" hint-placeholder-val="{{ false }}">

<span style="{{p.priceStyle}}">{{p.price}}</span>
</a>
<button type="button" aria-label="Přidat do oblíbených" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; color: #000"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></button>

<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin: 14px 16px 0"><span style="flex: 1 1 auto; height: 2px; background: #e8eaeb; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: #000"></span></span><span style="font-size: 12px; line-height: 16px; color: #555; white-space: nowrap; display: flex; align-items: center; gap: 4px">posuň pro další<svg class="arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></div>

<a href="katalog.html" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 14px">Bundy</a>
