<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Od workwearu ke streetwearu</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #e8eaeb; max-width: 620px">Příběh začal v roce 1889 v Detroitu, kdy Hamilton Carhartt založil firmu na odolné pracovní oblečení pro dělníky na železnicích. Dnes je Carhartt WIP jednou z nejvlivnějších streetwearových značek na světě.</p>

<h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600">Od amerického workwearu k vlastní identitě</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Původní Carhartt byl navržen pro extrémní podmínky – pevné plátno, trojité švy a maximální funkčnost. Tahle odolnost se postupně stala inspirací pro městskou kulturu, skate scénu i hudební subkultury.</p><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Carhartt Work In Progress založil v roce 1994 Edwin Faeh. Ikonické modely značky Carhartt upravuje a přetváří do vlastních kolekcí – žluté „C“ si dnes lidé spojují s hiphopovými klipy z konce 90. let a skate videi stejně jako s továrnami a manuální prací.</p>

<h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600">Kultura, města a globální komunita</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Carhartt WIP čerpá z propojených techno scén Detroitu a Berlína, ze skateboardingu mezi Paříží, New Yorkem a Soulem i ze současného umění. Tyto vlivy přetavuje do vlastního jazyka kolekcí, vizuální komunikace i výběru partnerů.</p><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Dnes provozuje více než 100 kamenných prodejen v Evropě, Asii a USA a spolupracuje s pečlivě vybranými partnery po celém světě.</p>
