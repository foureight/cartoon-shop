<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 2 };
  }
  renderVals() {
    const T = ['Pánské', 'Dámské', 'Vše'];
    return {
      tabs: T.map((t, i) => {
        const on = this.state.tab === i;
        return { label: t, pressed: on ? 'true' : 'false',
          style: 'min-height:48px;background:#fff;border:0;border-bottom:3px solid ' + (on ? '#00A151' : 'transparent') + ';font-family:FKGrotesk,sans-serif;font-size:16px;cursor:pointer;' + (on ? 'color:#00A151;font-weight:600' : 'color:#000;font-weight:400'),
          pick: () => this.setState({ tab: i }) };
      })
    };
  }
}
</script>
