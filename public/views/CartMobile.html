<section style="padding: 20px 16px 0">

<a href="#" style="flex: 0 0 96px; aspect-ratio: 4 / 5; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px; text-decoration: none; position: relative; overflow: hidden"><img src="{{it.img}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block"></a>

<div style="font-size: 12px; line-height: 16px; color: #555">{{it.type}}</div>
<h2 style="margin: 0; font-size: 16px; line-height: 20px; font-weight: 600">{{it.name}}</h2>
<div style="font-size: 13px; line-height: 18px; color: #555">{{it.color}} · vel. <b style="color: #000">{{it.size}}</b></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px">
<div role="group" aria-label="Počet kusů" style="display: flex; align-items: center; border: 1px solid #000">
<button type="button" onClick="{{it.dec}}" aria-label="Ubrat kus" style="width: 44px; height: 44px; background: #fff; border: 0; font-size: 20px">−</button>
