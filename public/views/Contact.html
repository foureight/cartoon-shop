<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kontakt</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:300;src:url(img/ce9b1a0918863c84b2d777d718880298.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a,nav[aria-label="Hlavní menu"] button{outline:none !important}nav[aria-label="Hlavní menu"] a:hover,nav[aria-label="Hlavní menu"] button:hover{color:#00A151 !important;border-bottom-color:#00A151 !important;font-weight:600 !important}nav[aria-label="Hlavní menu"] a[style*="#F59700"]:hover{color:#F59700 !important}
a[style*="#F59700"]:hover{color:#F59700 !important;text-decoration:underline !important;text-decoration-color:#F59700 !important;text-underline-offset:3px;border-bottom-color:#F59700 !important}
input[type="checkbox"],input[type="radio"]{accent-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a[data-sale="true"],nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{color:#F59700 !important}nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{font-weight:600 !important;text-decoration:none !important;border-bottom-color:#F59700 !important}
div[aria-labelledby="pro-koho"] button[aria-pressed="false"]:hover{background:#f4f4f4 !important}div[aria-labelledby="pro-koho"] button{outline:none !important}div[aria-labelledby="pro-koho"] button:focus-visible{outline:2px solid #00A151 !important;outline-offset:-2px}
</style>
</helmet>
<div style="width: 100%; min-width: 0; font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff">

<!-- TOP BAR -->
<div style="background: #000; color: #fff; font-size: 13px; line-height: 18px">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px">
<span>Oficiální distributor Carhartt WIP pro ČR &amp; SK</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 20px"><span>Objednej do 12:00, doručíme další pracovní den</span><span>Panská 7, Praha · Po–So 10–19 · Ne 10–18</span></span>
</div>
</div>

<!-- HEADER -->
<header onMouseLeave="{{closeMega}}" style="border-bottom: 1px solid #ddd">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px; display: grid; grid-template-columns: auto auto minmax(240px, 1fr) auto; align-items: center; gap: 12px 24px">
<a href="index.html" aria-label="Cartoon – úvod" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none">
<img src="img/6b673a984f403c01ecd9985d2700a26c.svg" alt="cartoon" style="width: 150px; height: auto; display: block">
</a>
<div role="group" aria-labelledby="pro-koho" style="display: flex; align-items: center; gap: 4px">
<span id="pro-koho" style="font-size: 15px; line-height: 18px; color: #555; margin-right: 4px">Pro koho:</span>
<sc-for list="{{genders}}" as="g" hint-placeholder-count="3"><button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button></sc-for>
</div>
<div onMouseLeave="{{closeSearch}}" style="position: relative; width: 100%; max-width: 600px; justify-self: center">
<form role="search" style="display: flex; border: 1px solid #000; box-sizing: border-box">
<label for="hq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat</label>
<input id="hq" type="search" value="{{sq}}" onChange="{{onSq}}" onFocus="{{openSearch}}" autocomplete="off" aria-autocomplete="list" aria-controls="hq-sug" aria-expanded="{{sopenStr}}" placeholder="Co hledáš?" style="flex: 1 1 auto; min-width: 0; border: 0; padding: 10px 12px; font-family: FKGrotesk, sans-serif; font-size: 15px">
<button type="submit" aria-label="Hledat" style="width: 44px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<sc-if value="{{sopen}}" hint-placeholder-val="{{ false }}">
<div id="hq-sug" style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; width: auto; max-width: calc(100vw - 48px); box-sizing: border-box; background: #fff; border: 1px solid #000; box-shadow: 0 24px 40px rgba(0,0,0,0.14); padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{sEmpty}}" hint-placeholder-val="{{ true }}">
<div>
<h3 style="margin: 0 0 10px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Často hledané</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{sPopular}}" as="p" hint-placeholder-count="6"><button type="button" onClick="{{p.pick}}" style="min-height: 36px; padding: 0 12px; background: #fff; border: 1px solid #ddd; font-family: FKGrotesk, sans-serif; font-size: 14px; font-weight: 600; color: #000; cursor: pointer">{{p.t}}</button></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{sHasCats}}" hint-placeholder-val="{{ false }}">
<div>
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Kategorie a značky</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 15px; line-height: 20px">
<sc-for list="{{sCats}}" as="c" hint-placeholder-count="3"><li><a href="{{c.href}}" style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; text-decoration: none"><span>{{c.pre}}<b>{{c.hit}}</b>{{c.post}}</span><span style="color: #555; font-size: 13px">{{c.where}}</span></a></li></sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{sHasProds}}" hint-placeholder-val="{{ false }}">
<div>
<h3 style="margin: 0 0 4px; font-size: 13px; line-height: 16px; font-weight: 700; color: #555">Produkty</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 15px; line-height: 20px">
<sc-for list="{{sProds}}" as="p" hint-placeholder-count="4"><li><a href="produkt.html" style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; text-decoration: none"><span>{{p.pre}}<b>{{p.hit}}</b>{{p.post}}</span><span style="color: #555; font-size: 13px">{{p.where}}</span></a></li></sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{sNone}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px">Pro „{{sq}}“ jsme nic nenašli. Zkus jiné slovo nebo projdi <a href="katalog.html">Novinky</a>.</p>
</sc-if>
<sc-if value="{{sTyped}}" hint-placeholder-val="{{ false }}">
<a href="katalog.html" style="border-top: 1px solid #ddd; padding-top: 12px; font-size: 15px; font-weight: 600">Zobrazit všechny výsledky pro „{{sq}}“ <span class="arr">→</span></a>
</sc-if>
</div>
</sc-if>
</div>
<div style="display: flex; gap: 4px; justify-self: end">
<a href="#" aria-label="Měna CZK / EUR" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9a4 4 0 1 0 0 6"></path></svg></a>
<a href="kontakt.html" aria-label="Kontakt" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
<a href="#" aria-label="Můj účet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
<a href="kosik.html" aria-label="Košík, 0 položek" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 6px; right: 4px; min-width: 16px; height: 16px; background: #000; color: #fff; font-size: 10px; line-height: 16px; text-align: center">0</span></a>
</div>
</div>
<div style="position: relative">
<nav aria-label="Hlavní menu" style="max-width: 1360px; margin: 0 auto; padding: 0 24px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 16px; line-height: 20px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
<li>
<sc-if value="{{n.hasMenu}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{n.toggle}}" onMouseEnter="{{n.open}}" aria-expanded="{{n.expanded}}" aria-haspopup="true" style="{{n.style}}">{{n.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="{{n.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<sc-if value="{{n.isLink}}" hint-placeholder-val="{{ true }}"><a onMouseEnter="{{n.open}}" href="katalog.html" data-sale="{{n.sale}}" style="{{n.style}}">{{n.label}}</a></sc-if>
</li>
</sc-for>
</ul>
</nav>
<sc-if value="{{megaOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: #fff; border-top: 1px solid #000; border-bottom: 1px solid #ddd; box-shadow: 0 32px 48px rgba(0,0,0,0.14)">
<div style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 36px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 32px; position: relative">
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; padding-right: 56px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700">{{mega.title}}</h2>
<span style="font-size: 14px; line-height: 20px; color: #555">{{genderLabel}}</span>
<a href="{{mega.allHref}}" style="font-size: 15px; font-weight: 600">{{mega.all}} <span class="arr">→</span></a>
</div>
<sc-for list="{{mega.cols}}" as="col" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h3 style="margin: 0 0 6px; font-size: 17px; line-height: 22px; font-weight: 700">{{col.h}}</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 16px; line-height: 20px">
<sc-for list="{{col.items}}" as="c" hint-placeholder-count="6"><li><a href="{{c.href}}" style="display: block; padding: 6px 0; text-decoration: none">{{c.t}}</a></li></sc-for>
</ul>
</div>
</sc-for>
<a href="katalog.html" style="grid-column: 5; grid-row: 2; position: relative; overflow: hidden; background: #293038; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 20px; min-height: 300px">
<img src="{{mega.outfitImg}}" alt="" loading="lazy" style="{{mega.outfitStyle}}"><span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 45%, rgba(0,0,0,0) 70%)"></span>
<span style="position: relative; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">Inspirace</span>
<span style="position: relative; font-size: 24px; line-height: 28px; font-weight: 700">Outfity</span>
<span style="position: relative; font-size: 14px; line-height: 19px; color: #e8eaeb">{{mega.outfitText}}</span>
<span style="position: relative; font-size: 15px; font-weight: 600; margin-top: 4px">Prohlédnout <span class="arr">→</span></span>
</a>
<button type="button" onClick="{{closeMega}}" aria-label="Zavřít menu" style="position: absolute; top: 16px; right: 12px; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</header>

<nav aria-label="Drobečková navigace" style="max-width: 1360px; margin: 0 auto; padding: 16px 24px 0; font-size: 13px; color: #555"><a href="index.html" style="color: #555">Úvod</a> / <span>Kontakt</span></nav>
<section style="max-width: 1360px; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em"><span style="width: 32px; height: 4px; background: {{accent}}"></span>Kontakt</div>
<h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Jak ti můžeme pomoct?</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2d2d2d; max-width: 640px">Ozvi se nám k objednávce, reklamaci nebo čemukoli z prodejny. Odpovídáme v otevírací době.</p>
</section>
<section aria-label="Kontaktní e-maily" style="max-width: 1360px; margin: 0 auto; padding: 48px 24px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="background: #000; color: #fff; padding: 32px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">Zákazníci – e-shop i prodejna</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; opacity: 0.85">Dotazy na zboží, objednávky, reklamace a vše, co se týká e-shopu i kamenného obchodu.</p>
<a href="mailto:obchod@cartoon.cz" style="color: #fff; font-weight: 700; font-size: 24px; line-height: 1.2; margin-top: 6px">obchod@cartoon.cz</a>
<a href="tel:+420224267486" style="color: #fff; font-weight: 600; text-decoration: none; font-size: 18px">+420 224 267 486</a>
</div>
<div style="background: #f4f4f4; padding: 32px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">Distribuce značek (B2B)</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; opacity: 0.85">Pro obchodní partnery, kteří nás chtějí kontaktovat jako distributora značek z naší nabídky.</p>
<a href="mailto:info@cartoon.cz" style="color: #000; font-weight: 700; font-size: 24px; line-height: 1.2; margin-top: 6px">info@cartoon.cz</a>

</div>
</section>
<section aria-labelledby="q-h" style="max-width: 1360px; margin: 0 auto; padding: 24px 24px 0">
<h2 id="q-h" style="margin: 0 0 8px; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">Možná najdeš odpověď rovnou tady</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Doprava a platba</a><a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Vrácení a výměna</a><a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Reklamace</a><a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Velikostní tabulky</a><a href="#" style="min-height: 44px; padding: 0 14px; border: 1px solid #000; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Obchodní podmínky</a></div>
</section>
<div style="max-width: 1360px; margin: 0 auto; padding: 72px 24px 0; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: flex-start">
<section aria-labelledby="f-h" style="flex: 3 1 560px; min-width: 0">
<h2 id="f-h" style="margin: 0 0 20px; font-size: 32px; line-height: 1.2; font-weight: 600">Napiš nám</h2>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #f4f4f4; padding: 24px; display: flex; flex-direction: column; gap: 10px; border-left: 4px solid {{accent}}"><b style="font-size: 20px">Díky, zpráva odešla.</b><span style="font-size: 15px; line-height: 22px">Odpovíme na tvůj e-mail v otevírací době. Kopii zprávy jsme ti poslali.</span><button type="button" onClick="{{reset}}" style="align-self: flex-start; min-height: 44px; background: none; border: 0; padding: 0; font-family: FKGrotesk, sans-serif; font-size: 15px; font-weight: 600; text-decoration: underline; cursor: pointer">Napsat další zprávu</button></div>
</sc-if>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<form style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="tp" style="font-size: 14px; line-height: 18px; font-weight: 600">Téma</label><select id="tp" style="min-height: 50px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; width: 100%; box-sizing: border-box; background: #fff"><option>Objednávka</option><option>Reklamace / vrácení</option><option>Prodejna Panská 7</option><option>Distribuce / B2B</option><option>Jiné</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="nm" style="font-size: 14px; line-height: 18px; font-weight: 600">Jméno a příjmení</label><input id="nm" type="text" autocomplete="name" style="min-height: 50px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; width: 100%; box-sizing: border-box; background: #fff"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="em" style="font-size: 14px; line-height: 18px; font-weight: 600">E-mail</label><input id="em" type="email" autocomplete="email" style="min-height: 50px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; width: 100%; box-sizing: border-box; background: #fff"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="ph" style="font-size: 14px; line-height: 18px; font-weight: 600">Telefon <span style="font-weight: 400; color: #555">(nepovinné)</span></label><input id="ph" type="tel" autocomplete="tel" style="min-height: 50px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; width: 100%; box-sizing: border-box; background: #fff"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="on" style="font-size: 14px; line-height: 18px; font-weight: 600">Číslo objednávky <span style="font-weight: 400; color: #555">(nepovinné)</span></label><input id="on" type="text" autocomplete="" style="min-height: 50px; padding: 0 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; width: 100%; box-sizing: border-box; background: #fff"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="msg" style="font-size: 14px; line-height: 18px; font-weight: 600">Zpráva</label><textarea id="msg" rows="6" style="padding: 12px 14px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 16px; resize: vertical"></textarea></div>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 20px; color: #2d2d2d; cursor: pointer"><input type="checkbox" checked="{{gdpr}}" onChange="{{toggleGdpr}}" style="width: 20px; height: 20px; margin: 0; accent-color: #000; flex: 0 0 auto">Souhlasím se zpracováním osobních údajů pro vyřízení dotazu. <a href="#">Více o GDPR</a></label>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="font-size: 14px; color: #c4301a; font-weight: 600">Pro odeslání potvrď souhlas se zpracováním údajů.</div></sc-if>
<button type="button" onClick="{{send}}" style="align-self: flex-start; min-height: 56px; padding: 0 32px; background: #00A151; color: #fff; border: 0; font-family: FKGrotesk, sans-serif; font-size: 17px; font-weight: 600; cursor: pointer">Odeslat zprávu</button>
</form>
</sc-if>

          megaOpen: !!mg, mega: Object.assign({ allHref: 'katalog.html', outfitStyle: 'position:absolute;inset:0;width:100%;height:100%;display:block;background:#f4f4f4;object-fit:cover;object-position:center' }, M[mg] || M.obleceni), closeMega: () => this.setState({ mega: null }),
          sq, sopen, sopenStr: sopen ? 'true' : 'false', sEmpty: !ql, sTyped: !!ql,
          sCats, sProds, sHasCats: sCats.length > 0, sHasProds: sProds.length > 0, sNone: !!ql && !sCats.length && !sProds.length,
          sPopular: ['Detroit Jacket', 'Double Knee', 'Mikiny s kapucí', 'Kšiltovky', 'Carhartt WIP', 'Kulichy'].map(t => ({ t, pick: () => this.setState({ sq: t, sopen: true }) })),
          onSq: e => this.setState({ sq: e && e.target ? e.target.value : '', sopen: true, mega: null }),
          openSearch: () => this.setState({ sopen: true, mega: null }),
          closeSearch: () => this.setState({ sopen: false }),
          genderLabel: gen === 'vse' ? 'Pánské i dámské' : (gen === 'panske' ? 'Pánské' : 'Dámské'),
          genders: G.map(([k, l], i) => ({ label: l, pressed: gen === k ? 'true' : 'false',
            style: gbase + (gen === k ? 'color:#000;background:#e8e8e8;' : 'color:#000;background:transparent;'),
            pick: () => this.setState({ gen: k }) })),
          navItems: N.map(([k, l, sub]) => {
            const open = mg === k; const isCur = cur === k; const sale = k === 'slevy';
            const on = open || (isCur && !mg);
            return { label: l, sale: sale ? 'true' : 'false', hasMenu: !!sub, isLink: !sub, expanded: open ? 'true' : 'false',
              style: base + 'color:' + (sale ? '#F59700' : (on ? '#00A151' : '#000')) + ';' + 'border-bottom:3px solid ' + (on ? (sale ? '#F59700' : '#00A151') : 'transparent') + ';',
              chev: 'transform:rotate(' + (open ? '180deg' : '0deg') + ')',
              toggle: () => this.setState({ mega: open ? null : k, sopen: false }),
              open: () => this.setState({ mega: sub ? k : null, sopen: false }) };
          })
        };
      })(),
      footCols: [
        { title: 'Pro zákazníky', links: ['Jak nakupovat', 'Doprava a platba', 'Rezervace zboží', 'Vrácení a výměna', 'Reklamace', 'Velikostní tabulky', 'Dárkové poukazy'] },
        { title: 'Smluvní podmínky', links: ['Obchodní podmínky', 'Odstoupení od smlouvy', 'Ochrana osobních údajů', 'Cookies', 'Pravidla akce kachna'] },
        { title: 'O nás', links: ['Proč Cartoon', 'Prodejna Panská 7', 'Carhartt WIP Praha', 'Distribuce Carhartt WIP CZ/SK', 'Značky', 'Práce', 'Spolupráce'] }
      ].map((c, i) => ({ title: c.title, links: c.links, open: this.state.foot === i, expanded: this.state.foot === i ? 'true' : 'false', sign: this.state.foot === i ? '−' : '+', toggle: () => this.setState({ foot: this.state.foot === i ? -1 : i }) })),
      accent: this.props.accent ?? '#00A151',
      sent: st.sent, notSent: !st.sent, gdpr: st.gdpr, err: st.err,
      toggleGdpr: () => this.setState({ gdpr: !st.gdpr, err: false }),
      send: () => st.gdpr ? this.setState({ sent: true }) : this.setState({ err: true }),
      reset: () => this.setState({ sent: false, gdpr: false }),
    };
  }
}
