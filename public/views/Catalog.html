<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Oblečení – katalog</title>
</head>
<body>
<template id="x-dc">
<helmet>
<style>
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:300;src:url(img/ce9b1a0918863c84b2d777d718880298.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:400;src:url(img/1e1321f388e34db8b2e794b91d35f268.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:600;src:url(img/f4469fd3f08bc29d491d8cea58b02134.woff2) format("woff2");font-display:swap}
@font-face{font-family:FKGrotesk;font-style:normal;font-weight:700;src:url(img/25d77fd3cc86c5ee7a077a742301b66a.woff2) format("woff2");font-display:swap}
body{margin:0;background:#fff}
a{color:#000}a:not([style*="background"]):not([style*="border"]):not([style*="flex-direction: column"]):hover{color:#00A151 !important;text-decoration:underline !important;text-underline-offset:3px}
.arr{display:inline-block;flex:0 0 auto;transition:transform .2s ease-in}a:hover .arr,button:hover .arr{transform:translateX(8px)}
:focus-visible{outline:2px solid #00A151 !important;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #00A151 !important;outline-offset:0;border-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a,nav[aria-label="Hlavní menu"] button{outline:none !important}nav[aria-label="Hlavní menu"] a:hover,nav[aria-label="Hlavní menu"] button:hover{color:#00A151 !important;border-bottom-color:#00A151 !important;font-weight:600 !important}nav[aria-label="Hlavní menu"] a[style*="#F59700"]:hover{color:#F59700 !important}
a[style*="#F59700"]:hover{color:#F59700 !important;text-decoration:underline !important;text-decoration-color:#F59700 !important;text-underline-offset:3px;border-bottom-color:#F59700 !important}
input[type="checkbox"],input[type="radio"]{accent-color:#00A151 !important}
nav[aria-label="Hlavní menu"] a[data-sale="true"],nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{color:#F59700 !important}nav[aria-label="Hlavní menu"] a[data-sale="true"]:hover{font-weight:600 !important;text-decoration:none !important;border-bottom-color:#F59700 !important}
div[aria-label="Oddělení"] button:hover{color:#00A151 !important}div[aria-label="Oddělení"] button{outline:none !important}div[aria-label="Oddělení"] button:focus-visible{outline:2px solid #00A151 !important;outline-offset:-2px}
</style>
</helmet>
<div style="font-family: FKGrotesk, sans-serif; font-size: 16px; line-height: 1.6; color: #000; background: #fff; width: 100%; min-width: 0">

<!-- TOP BAR -->
<div style="background: #000; color: #fff; font-size: 13px; line-height: 18px">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px">
<span>Oficiální distributor Carhartt WIP pro ČR &amp; SK</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 20px"><span>Objednej do 12:00, doručíme další pracovní den</span><span>Panská 7, Praha · Po–So 10–19 · Ne 10–18</span></span>
</div>
</div>

<!-- HEADER -->
<header onMouseLeave="{{closeMega}}" style="border-bottom: 1px solid #ddd">
<div style="border-bottom: 1px solid #ddd">
<div role="group" aria-label="Oddělení" style="max-width: 1360px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px">
<sc-for list="{{genders}}" as="g" hint-placeholder-count="3"><button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button></sc-for>
</div>
</div>
<div style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 560px) minmax(0, 1fr); align-items: center; gap: 16px 32px">
<a href="index.html" aria-label="Cartoon – úvod" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; justify-self: start">
<img src="img/6b673a984f403c01ecd9985d2700a26c.svg" alt="cartoon" style="width: 150px; height: auto; display: block">
</a>
<form style="display: flex; width: 100%; border: 1px solid #000; box-sizing: border-box">
<label for="hq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat</label>
<input id="hq" type="search" placeholder="vyhledej co chceš" style="flex: 1 1 auto; min-width: 0; border: 0; padding: 12px 14px; font-family: FKGrotesk, sans-serif; font-size: 15px">
<button type="submit" aria-label="Hledat" style="width: 48px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<div style="display: flex; gap: 4px; justify-self: end">
<a href="#" aria-label="Měna CZK / EUR" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9a4 4 0 1 0 0 6"></path></svg></a>
<a href="kontakt.html" aria-label="Kontakt" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
<a href="#" aria-label="Můj účet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
<a href="kosik.html" aria-label="Košík, 0 položek" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 6px; right: 4px; min-width: 16px; height: 16px; background: #000; color: #fff; font-size: 10px; line-height: 16px; text-align: center">0</span></a>
</div>
</div>
<div style="position: relative">
<nav aria-label="Hlavní menu" style="max-width: 1360px; margin: 0 auto; padding: 0 24px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 16px; line-height: 20px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
<li>
<sc-if value="{{n.hasMenu}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{n.toggle}}" onMouseEnter="{{n.open}}" aria-expanded="{{n.expanded}}" aria-haspopup="true" style="{{n.style}}">{{n.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="{{n.chev}}"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<sc-if value="{{n.isLink}}" hint-placeholder-val="{{ true }}"><a onMouseEnter="{{n.open}}" href="katalog.html" data-sale="{{n.sale}}" style="{{n.style}}">{{n.label}}</a></sc-if>
</li>
</sc-for>
</ul>
</nav>
<sc-if value="{{megaOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: #fff; border-top: 1px solid #000; border-bottom: 1px solid #ddd; box-shadow: 0 32px 48px rgba(0,0,0,0.14)">
<div style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 40px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 32px; position: relative">
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; padding-right: 56px">
<h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600">{{mega.title}}</h2>
<span style="font-size: 14px; line-height: 20px; color: #555">{{genderLabel}}</span>
<a href="{{mega.allHref}}" style="font-size: 15px; font-weight: 600">{{mega.all}} <span class="arr">→</span></a>
</div>
<sc-for list="{{mega.cols}}" as="col" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h3 style="margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid #ddd; font-size: 13px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555">{{col.h}}</h3>
<ul style="list-style: none; margin: 0; padding: 0; font-size: 16px; line-height: 20px">
<sc-for list="{{col.items}}" as="c" hint-placeholder-count="6"><li><a href="{{c.href}}" style="display: block; padding: 7px 0; text-decoration: none">{{c.t}}</a></li></sc-for>
</ul>
</div>
</sc-for>
<a href="katalog.html" style="grid-column: 5; grid-row: 2; position: relative; overflow: hidden; background: #293038; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 20px; min-height: 300px">
<img src="{{mega.outfitImg}}" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: center"><span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0) 70%)"></span>
<span style="position: relative; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">Inspirace</span>
<span style="position: relative; font-size: 24px; line-height: 28px; font-weight: 700">Outfity</span>
<span style="position: relative; font-size: 15px; font-weight: 600">Prohlédnout <span class="arr">→</span></span>
</a>
<button type="button" onClick="{{closeMega}}" aria-label="Zavřít menu" style="position: absolute; top: 16px; right: 12px; width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</header>

<!-- ÚVOD KATEGORIE -->
<section style="max-width: 1360px; margin: 0 auto; padding: 16px 24px 0">
<nav aria-label="Drobečková navigace" style="font-size: 13px; color: #555"><a href="index.html" style="color: #555">Úvod</a> / <span>Oblečení</span></nav>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 48px; padding: 24px 0 28px">
<div style="flex: 1 1 420px; min-width: 0">
<h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Oblečení <span style="font-size: 18px; line-height: 24px; font-weight: 400; color: #555; letter-spacing: 0; vertical-align: top">1 019</span></h1>
</div>
<p style="flex: 1 1 420px; max-width: 560px; margin: 0; font-size: 16px; line-height: 1.65; color: #2d2d2d">Trička, mikiny, bundy, košile a kalhoty od Carhartt WIP, Edwin, Iriedaily a The Dudes. Kvalitní materiály a nadčasový design pro každodenní nošení.</p>
</div>
<!-- podkategorie -->
<ul aria-label="Podkategorie" style="list-style: none; margin: 0; padding: 0 0 4px; display: flex; gap: 10px; overflow-x: auto">
<sc-for list="{{subcats}}" as="c" hint-placeholder-count="10">
<li style="flex: 0 0 auto"><a href="katalog.html" style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border: 1px solid #ddd; text-decoration: none; font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap"><img src="{{c.img}}" alt="" width="40" height="40" style="width: 40px; height: 40px; object-fit: contain; background: #fff; display: block; flex: 0 0 auto">{{c.label}}</a></li>
</sc-for>
</ul>
</section>

<!-- KATALOG S FILTRY VLEVO -->
<div style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 0; display: flex; gap: 40px; align-items: flex-start">
<aside aria-label="Filtry" style="{{asideStyle}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid #000">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600">Filtry</h2>
<button type="button" onClick="{{clearAll}}" style="min-height: 36px; background: none; border: 0; padding: 0; font-family: FKGrotesk, sans-serif; font-size: 14px; text-decoration: underline; cursor: pointer">Zrušit vše</button>
</div>
<div style="display: flex; flex-direction: column; padding: 10px 0; border-bottom: 1px solid #ddd">
<sc-for list="{{sideToggles}}" as="t" hint-placeholder-count="3"><button type="button" role="switch" aria-checked="{{t.pressed}}" onClick="{{t.toggle}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; background: none; border: 0; padding: 0; font-family: FKGrotesk, sans-serif; font-size: 15px; color: #000; cursor: pointer">{{t.label}}<span style="{{t.track}}"><span style="{{t.knob}}"></span></span></button></sc-for>
</div>
<sc-for list="{{sideFilters}}" as="f" hint-placeholder-count="7">
<div style="border-bottom: 1px solid #ddd">
<h3 style="margin: 0"><button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.expanded}}" style="width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; font-family: FKGrotesk, sans-serif; font-size: 16px; font-weight: 600; color: #000; cursor: pointer">{{f.label}} {{f.countLabel}}<span aria-hidden="true" style="font-size: 20px; font-weight: 400">{{f.sign}}</span></button></h3>
<sc-if value="{{f.isOpen}}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 0 16px">
<sc-if value="{{f.isGrid}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><sc-for list="{{f.options}}" as="o" hint-placeholder-count="8"><button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.pressed}}" title="{{o.count}} produktů" style="{{o.gridStyle}}">{{o.label}}</button></sc-for></div></sc-if>
<sc-if value="{{f.isList}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column"><sc-for list="{{f.options}}" as="o" hint-placeholder-count="4"><button type="button" role="checkbox" aria-checked="{{o.pressed}}" onClick="{{o.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; background: none; border: 0; padding: 0; font-family: FKGrotesk, sans-serif; font-size: 15px; color: #000; text-align: left; cursor: pointer"><span style="{{o.box}}">{{o.check}}</span><span style="{{o.dot}}"></span><span style="flex: 1 1 auto">{{o.label}}</span><span style="font-size: 13px; color: #555">{{o.count}}</span></button></sc-for></div></sc-if>
<sc-if value="{{f.isPrice}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 12px"><div style="height: 4px; background: #e8eaeb; position: relative; margin: 8px 8px"><span style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #000"></span><span style="position: absolute; left: -8px; top: -8px; width: 20px; height: 20px; background: #fff; border: 2px solid #000; border-radius: 50%; box-sizing: border-box"></span><span style="position: absolute; right: -8px; top: -8px; width: 20px; height: 20px; background: #fff; border: 2px solid #000; border-radius: 50%; box-sizing: border-box"></span></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555">od<input value="[min] Kč" style="min-height: 44px; padding: 0 10px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 15px"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555">do<input value="[max] Kč" style="min-height: 44px; padding: 0 10px; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 15px"></label></div></div></sc-if>
</div>
</sc-if>
</div>
</sc-for>
</aside>
<section aria-label="Produkty" style="flex: 1 1 auto; min-width: 0">
<div style="{{topCollapsedStyle}}"><button type="button" onClick="{{toggleFilters}}" aria-expanded="false" style="min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; white-space: nowrap; background: #000; color: #fff; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Zobrazit filtry</button></div>
<div aria-label="Filtry" role="region" style="{{topRegionStyle}}">
<div style="display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid #000; border-bottom: 1px solid #ddd">
<button type="button" onClick="{{toggleFilters}}" aria-expanded="{{fltExpanded}}" aria-label="{{fltLabel}}" title="{{fltLabel}}" style="width: 44px; height: 44px; padding: 0; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; background: #000; color: #fff; border: 1px solid #000; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; overflow-x: auto">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
<button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.expanded}}" style="{{f.btnStyle}}">{{f.label}}<span style="font-size: 12px; font-weight: 600">{{f.countLabel}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="{{f.chevron}}"><path d="M6 9l6 6 6-6"></path></svg></button>
</sc-for>
<span style="flex: 0 0 1px; height: 28px; background: #ddd; margin: 0 4px"></span>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<!-- rozbalený filtr -->
<sc-if value="{{hasOpen}}" hint-placeholder-val="{{ true }}">
<div style="border-bottom: 1px solid #ddd; padding: 20px 0 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">{{openFilter.label}}</h2><button type="button" onClick="{{closeFilter}}" style="background: none; border: 0; font-family: FKGrotesk, sans-serif; font-size: 14px; text-decoration: underline; cursor: pointer; min-height: 44px">Zavřít</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{openFilter.options}}" as="o" hint-placeholder-count="8">
<button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}} <span style="{{o.countStyle}}">{{o.count}}</span></button>
</sc-for>
</div>
</div>
</sc-if>
</div>
<div style="padding-bottom: 12px; border-bottom: 1px solid #000; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 16px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 40px"><button type="button" onClick="{{toggleFilters}}" aria-expanded="false" style="min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; white-space: nowrap; background: #000; color: #fff; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer{{sideShowExtra}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Zobrazit filtry</button><span style="font-size: 15px; font-weight: 600; white-space: nowrap">{{prodCount}}</span><sc-for list="{{active}}" as="a" hint-placeholder-count="2"><button type="button" onClick="{{a.remove}}" aria-label="Zrušit filtr {{a.label}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; background: #000; color: #fff; border: 0; font-family: FKGrotesk, sans-serif; font-size: 13px; cursor: pointer">{{a.label}} <span aria-hidden="true">×</span></button></sc-for></div>
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px"><button type="button" onClick="{{toggleFilters}}" aria-expanded="{{fltExpanded}}" style="min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; white-space: nowrap; background: #fff; color: #000; border: 1px solid #000; font-family: FKGrotesk, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer{{sideHideExtra}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>{{fltLabel}}</button><label style="display: flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap">Seřadit
<select style="min-height: 40px; padding: 0 10px; border: 1px solid #000; background: #fff; font-family: FKGrotesk, sans-serif; font-size: 15px"><option>Nejnovější</option><option>Nejprodávanější</option><option>Od nejlevnějšího</option><option>Od nejdražšího</option><option>Největší sleva</option></select></label></div>
</div>
<div style="display: grid; grid-template-columns: {{gridCols}}; gap: 36px 16px">
<sc-for list="{{first}}" as="p" hint-placeholder-count="4">
<div style="position: relative">
